name: Deploy backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-hf-backend.yml"
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_USERNAME" || (echo "Missing secret: HF_USERNAME" && exit 1)
          test -n "$HF_SPACE_REPO" || (echo "Missing secret: HF_SPACE_REPO (example: Scapini/GymTracker)" && exit 1)
          test -n "$HF_TOKEN" || (echo "Missing secret: HF_TOKEN" && exit 1)

      - name: Clone Hugging Face Space repo
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" /tmp/hf-space

      - name: Sync backend files into Space
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'README.md' \
            backend/ /tmp/hf-space/

      - name: Commit and push if changed
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd /tmp/hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No backend changes to deploy."
            exit 0
          fi
          git commit -m "deploy: sync backend from ${GITHUB_SHA}"
          git push origin main
